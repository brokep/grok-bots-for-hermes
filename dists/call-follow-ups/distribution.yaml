name: grok-call-follow-ups
version: 1.0.0
description: "Turns each recorded call into a follow-up email in your voice, a next-steps note, and the CRM updates, including the qualification fields your team runs on. Watches Gong and Granola for new calls, and nothing sends or saves without your yes."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by Daniel Brill"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
