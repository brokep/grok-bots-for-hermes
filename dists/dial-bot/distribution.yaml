name: grok-dial-bot
version: 1.0.0
description: "Places outbound Bland AI phone calls when you ask, then reports what happened. On first use it asks for a Bland API key and voice."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by Matt Palmer"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
