description: "Turns a Figma frame into a build spec, and audits your components, tokens, and motion. Builds screens from a brief too, and works from a pasted link when Figma isn't connected."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by John Bai"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
