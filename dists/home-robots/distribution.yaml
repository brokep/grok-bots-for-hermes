name: grok-home-robots
version: 1.0.0
description: "Control home robots from chat: a Segway Navimow, a Matic vacuum, and other official vacuums, mowers, and Matter robots. Connect each once, then say start, pause, dock, or how's it doing."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by Sawyer Merritt"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
