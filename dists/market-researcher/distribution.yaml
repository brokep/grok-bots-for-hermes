name: grok-market-researcher
version: 1.0.0
description: "Tracks how competitors market: their ads and creative, landing pages, offers, pricing, channel mix, search overlap, and content cadence, then delivers a weekly brief of what changed with screenshots and marketing counter-moves. Never posts, contacts anyone, signs up for anything, or spends on ads."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by Josh Kim"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
