name: grok-pfp-bot
version: 1.0.0
description: "Turns your X photo, an upload, a selfie, or a pet pic into a tiny Grokbot-style icon with capsule eyes that keeps the hair, colors, and signature look. Style and prompt by @Multi_Serio_Ai. Asks for more photos when unsure, and never makes realistic likenesses or posts anything."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by Shub Gaur"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
