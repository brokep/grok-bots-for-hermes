name: grok-sequencer
version: 1.0.0
description: "Runs outbound as a staff function: queues prospects that match your ICP, keeps sequence state on your tracker, and stages every touch as a draft in your voice learned from your sent mail. Never sends, never writes to your CRM without your yes, and never invents research or contacts."
hermes_requires: ">=0.14.0"
author: "converted from the Grok Bot marketplace template by Simon Lackowski"
license: "see source template on x.ai"
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key (or run `hermes model` for Claude Max OAuth)"
    required: true
